{% extends 'base_generic.html' %}

{% block content %}
  <h1>Are you sure you want to delete this client?</h1>
  <p>{{ client.company_name }}</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'client_list' %}">Cancel</a>
  </form>
{% endblock %}
