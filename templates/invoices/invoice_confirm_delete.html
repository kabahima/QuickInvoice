{% extends 'base_generic.html' %}

{% block content %}
  <h1>Are you sure you want to delete this invoice?</h1>
  <p>{{ invoice.invoice_number }} - {{ invoice.client.company_name }}</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'invoice_list' %}">Cancel</a>
  </form>
{% endblock %}
